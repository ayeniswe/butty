services:
  butty:
    image: localhost/butty:latest
    container_name: butty
    ports:
      - "8001:8001"
    env_file:
      - .env.prod
    environment:
      BUTTY_DB_PATH: /data/butty.db
    volumes:
      - butty_data:/data
    restart: unless-stopped

  butty-dev:
    build: .
    image: localhost/butty:dev
    container_name: butty-dev
    ports:
      - "8002:8001"
    env_file:
      - .env.test
    environment:
      BUTTY_DB_PATH: /data/butty.dev.db
    volumes:
      - butty_data_dev:/data
    restart: unless-stopped

volumes:
  butty_data:
  butty_data_dev:
